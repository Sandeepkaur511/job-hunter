name: Daily 12 PM Job Hunter Scan

on:
  schedule:
    # 12:00 PM IST = 06:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Daily Job Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u main.py

      - name: Persist Database Updates
        run: |
          git config --global user.name "Sandeep Job Bot"
          git config --global user.email "bot@github-action.com"
          git add jobs.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist daily job log & memory [skip ci]" && git push)
